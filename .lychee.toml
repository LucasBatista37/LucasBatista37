# Configuração do lychee (verificador de links) usada em .github/workflows/readme-checks.yml
max_retries = 3
retry_wait_time = 5
timeout = 30
max_concurrency = 8
accept = ["200..=299", "429"]
include_fragments = false
# Sites que bloqueiam robôs ou exigem login (verificados manualmente no navegador):
exclude = [
  '^https://(www\.)?linkedin\.com/',
  '^https://wa\.me/',
  '^mailto:',
]
